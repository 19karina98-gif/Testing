<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A cute pastel sticky notepad with animated characters for your desktop." />
  <meta name="theme-color" content="#f06292" />
  <title>🌸 Cute Sticky Notes</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>" />
</head>
<body>

  <div class="toolbar">
    <div class="toolbar-left">
      <span class="app-title">🌸 Sticky Notes</span>
      <span class="note-counter" id="noteCounter">0 notes</span>
    </div>
    <div class="toolbar-right">
      <button class="tool-btn" id="gridToggle" title="Snap to grid">⊞ Snap</button>
      <button class="tool-btn" id="tidyBtn"    title="Arrange notes neatly">✦ Tidy</button>
      <button class="tool-btn danger" id="clearBtn" title="Remove all notes">🗑 Clear</button>
      <button class="add-btn" id="addNote">＋ New Note</button>
    </div>
  </div>

  <div class="board" id="board"></div>

  <template id="note-tpl">
    <div class="note">
      <!-- tape strip -->
      <div class="note-tape"></div>
      <!-- animated cartoon characters on edges (filled by JS per theme) -->
      <span class="char char-tl"></span>
      <span class="char char-tr"></span>
      <span class="char char-bl"></span>
      <span class="char char-br"></span>
      <span class="char char-mid"></span>
      <!-- note content -->
      <div class="note-header">
        <button class="pin-btn" title="Pin / unpin note">📌</button>
        <div class="color-row">
          <span class="dot" data-color="pink"     style="background:#ffb3c6"></span>
          <span class="dot" data-color="yellow"   style="background:#ffe066"></span>
          <span class="dot" data-color="mint"     style="background:#7de8a2"></span>
          <span class="dot" data-color="lavender" style="background:#c4a8f5"></span>
          <span class="dot" data-color="peach"    style="background:#ffaa7a"></span>
          <span class="dot" data-color="sky"      style="background:#7ecef4"></span>
        </div>
        <button class="delete-btn" title="Delete note">✕</button>
      </div>
      <input  class="note-title" type="text"  placeholder="Title…" maxlength="50" />
      <textarea class="note-text" placeholder="Write something here ✨" rows="5"></textarea>
      <div class="note-footer">
        <span class="note-date"></span>
        <span class="note-words">0 words</span>
      </div>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
